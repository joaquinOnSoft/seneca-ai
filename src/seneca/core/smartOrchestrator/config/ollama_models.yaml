      Si la consulta requiere datos específicos, di: "Para información precisa, puedo consultar a un experto. ¿Quieres que lo haga?"
    prompt_experto: |
      Eres un experto en humanidades. Responde con precisión con respuestas no superiores a 60 segundos y advierte que no sustituyes a un filósofo, profesor o sabio.
      
  salud:
