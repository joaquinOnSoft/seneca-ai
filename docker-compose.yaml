# ══════════════════════════════════════════════════════════════
#  docker-compose.yaml
#  Services:
#    · ollama     — local LLM server, port 11434
#    · api  — SenecaAI API server, port 1414. Python + ALSA + JACK + PyAudio
#
#  Basic usage (CPU):
#    docker compose up --build
#
#  With NVIDIA GPU:
#    Uncomment the `deploy` block in the ollama service and
#    make sure nvidia-container-toolkit is installed on the host.
# ══════════════════════════════════════════════════════════════

services:

  # ────────────────────────────────────────────────────────────
  #  ollama — local LLM server
  # ────────────────────────────────────────────────────────────
  ollama:
    build:
      context: ./docker/ollama
      dockerfile: Dockerfile
    container_name: ollama
    restart: unless-stopped

    environment:
      # Model the entrypoint will pull on first startup
      OLLAMA_MODEL: "${OLLAMA_AI_MODEL:-hadad/LFM2.5-1.2B:Q4_K_M}"
      # Seconds the model stays loaded in memory without requests
      OLLAMA_KEEP_ALIVE: "300"
      # 0 = CPU only · -1 = all layers on GPU
      OLLAMA_NUM_GPU: "0"

    ports:
      - "11434:11434"

    volumes:
      # Models persisted on the host — pull is skipped on restarts
      - ollama_models:/root/.ollama

    networks:
      - llm_net

    # ── NVIDIA GPU (uncomment to enable) ──────────────────────
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:11434/api/version"]
      interval: 20s
      timeout: 5s
      start_period: 90s   # allows time for the model pull on first run
      retries: 5

  # ────────────────────────────────────────────────────────────
  #  api - SenecaAI API server, port 1414.
  #  Python + ALSA + JACK + PyAudio
  # ────────────────────────────────────────────────────────────
  api:
    build:
      context: . # Changed context to project root
      dockerfile: ./docker/api/Dockerfile # Specified full path to Dockerfile
    container_name: api
    restart: unless-stopped

    environment:
      # Ollama service URL reachable inside the Docker network
      OLLAMA_BASE_URL: "http://ollama:11434"
      OLLAMA_MODEL: "hadad/LFM2.5-1.2B:Q4_K_M"
      # Pass through whisper config from host .env to container
      WHISPER_MODEL_SIZE: "${WHISPER_MODEL_SIZE:-tiny}"
      WHISPER_DEVICE: "${WHISPER_DEVICE:-cpu}"
      WHISPER_COMPUTE_TYPE: "${WHISPER_COMPUTE_TYPE:-int8}"
      # Define the path to the API key file within the container
      SENECA_AI_API_KEY_FILE: "/run/secrets/seneca_ai_api_key_secret" # Corregido para apuntar a la ubicación por defecto de Docker Secrets

    ports:
      - "1414:1414" # Expose the API port

    volumes:
      # Source code mounted for hot-reload during development (no rebuild needed)
      - ./src:/app/src
      # Host PulseAudio socket (only needed if the host uses PulseAudio)
      - /run/user/1000/pulse:/run/user/1000/pulse:ro

    devices:
      # Expose all host ALSA devices to the container
      - /dev/snd:/dev/snd

    group_add:
      # Host 'api' GID must match the one inside the container
      - api

    cap_add:
      # Required for JACK real-time scheduling priority
      - SYS_NICE

    networks:
      - llm_net

    depends_on:
      ollama:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:1414/senecaai/v1/health"] # Cambiado a /seneca/v1/health
      interval: 20s
      timeout: 5s
      start_period: 15s # Give the Flask app time to start
      retries: 5
    secrets:
      - seneca_ai_api_key_secret
    storage_opt:
      size: 5G

# ── Volumes ────────────────────────────────────────────────────
volumes:
  ollama_models:
    driver: local
    driver_opts:
      type: none
      o: bind
      # Host path where downloaded models are persisted.
      # Create it before the first `docker compose up`:
      #   sudo mkdir -p /opt/senecaai/volumes/ollama
      #   sudo chown -R $USER:$USER /opt/senecaai
      device: "${OLLAMA_MODELS_PATH:-/opt/senecaai/volumes/ollama}"

# ── Internal network ───────────────────────────────────────────
networks:
  llm_net:
    driver: bridge

# ── Secrets ────────────────────────────────────────────────────
secrets:
  seneca_ai_api_key_secret:
    file: docker/api/seneca_ai_api_key.txt