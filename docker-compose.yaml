# ══════════════════════════════════════════════════════════════
#  docker-compose.yaml
#  Services:
#    · ollama         — local LLM server, port 11434
#    · mongo          — MongoDB (conversations, users), internal only
#    · qdrant         — vector index of past conversations (memory), internal only
#    · api            — SenecaAI API server, port 1414. Python + ALSA + JACK + PyAudio
#    · memory-worker  — indexes the conversations into qdrant (same image as api)
#
#  Basic usage (CPU):
#    docker compose up --build
#
#  With NVIDIA GPU:
#    Uncomment the `deploy` block in the ollama service and
#    make sure nvidia-container-toolkit is installed on the host.
# ══════════════════════════════════════════════════════════════

# ── Settings shared by api and memory-worker ───────────────────
x-llm-env: &llm-env
  # ── Chat LLM (the API calls it; the desktop app only talks to the API)
  # openai | ollama | anthropic — taken from the host .env
  LLM_PROVIDER: "${LLM_PROVIDER:-ollama}"
  # Ollama service URL reachable inside the Docker network
  OLLAMA_BASE_URL: "http://ollama:11434"
  OLLAMA_MODEL: "${OLLAMA_MODEL:-hadad/LFM2.5-1.2B:Q4_K_M}"
  # Only needed with LLM_PROVIDER=openai / anthropic
  OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
  OPENAI_MODEL: "${OPENAI_MODEL:-gpt-4o-mini}"
  ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
  ANTHROPIC_MODEL: "${ANTHROPIC_MODEL:-claude-3-haiku-20240307}"

x-memory-env: &memory-env
  # ── Long-term memory: search across the user's past conversations
  MEMORY_ENABLED: "${MEMORY_ENABLED:-true}"
  QDRANT_URL: "http://qdrant:6333"
  # Ollama embedding model; the worker pulls it on its first start (~1.2 GB)
  EMBEDDING_MODEL: "${EMBEDDING_MODEL:-bge-m3}"
  MEMORY_TOP_K: "${MEMORY_TOP_K:-5}"
  MEMORY_MIN_SCORE: "${MEMORY_MIN_SCORE:-0.5}"
  MEMORY_MAX_CHARS: "${MEMORY_MAX_CHARS:-4000}"
  MEMORY_SEARCH_TIMEOUT: "${MEMORY_SEARCH_TIMEOUT:-3}"
  MEMORY_SUMMARY_EVERY_TURNS: "${MEMORY_SUMMARY_EVERY_TURNS:-6}"
  # Mongo connection — credentials read from the secret files
  # (seneca.utils.config), not embedded in the URI.
  MONGODB_URI: "mongodb://mongo:27017/${MONGO_INITDB_DATABASE:-senecaai}"
  MONGO_ROOT_USERNAME_FILE: "/run/secrets/mongo_root_username"
  MONGO_ROOT_PASSWORD_FILE: "/run/secrets/mongo_root_password"
  # Secret used to sign the JWT access tokens (required by seneca.utils.config).
  # The file is generated by the install/redeploy scripts and is not versioned.
  JWT_SECRET_KEY_FILE: "/run/secrets/jwt_secret_key"

services:

  # ────────────────────────────────────────────────────────────
  #  ollama — local LLM server
  # ────────────────────────────────────────────────────────────
  ollama:
    build:
      context: ./docker/ollama
      dockerfile: Dockerfile
      network: host
    container_name: ollama
    restart: unless-stopped

    environment:
      # Model the entrypoint will pull on first startup. docker compose reads
      # OLLAMA_MODEL from the shell environment first, then from .env
      OLLAMA_MODEL: "${OLLAMA_MODEL:-hadad/LFM2.5-1.2B:Q4_K_M}"
      # Seconds the model stays loaded in memory without requests
      OLLAMA_KEEP_ALIVE: "300"
      # 0 = CPU only · -1 = all layers on GPU
      OLLAMA_NUM_GPU: "0"

    ports:
      - "11434:11434"

    volumes:
      # Models persisted on the host — pull is skipped on restarts
      - ollama_models:/root/.ollama

    networks:
      - llm_net

    # ── NVIDIA GPU (uncomment to enable) ──────────────────────
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:11434/api/version"]
      interval: 20s
      timeout: 5s
      start_period: 90s   # allows time for the model pull on first run
      retries: 5

  # ────────────────────────────────────────────────────────────
  #  mongo — MongoDB document store, port 27017
  #  Used for SenecaAI persistence (sessions, transcripts, etc.)
  # ────────────────────────────────────────────────────────────
  mongo:
    image: mongo:7.0.37  # Stable and compatible version
    container_name: mongo
    restart: unless-stopped

    environment:
      # The official mongo image reads *_FILE variants via Docker secrets
      MONGO_INITDB_ROOT_USERNAME_FILE: /run/secrets/mongo_root_username
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/mongo_root_password
      MONGO_INITDB_DATABASE: "${MONGO_INITDB_DATABASE:-senecaai}"

    # Removed ports mapping to make it only internally accessible
    # ports:
    #   - "27017:27017"

    volumes:
      # Database files persisted on the host — same bind-mount pattern as ollama_models
      - mongodb_data:/data/db

    networks:
      - llm_net

    secrets:
      - mongo_root_username
      - mongo_root_password

    healthcheck:
      # mongosh ships inside the official image since MongoDB 6
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 20s
      timeout: 5s
      start_period: 20s
      retries: 5

  # ────────────────────────────────────────────────────────────
  #  qdrant — vector database, port 6333 (internal only)
  #  Index of the conversation turns used as long-term memory.
  #  Disposable: it can be rebuilt from MongoDB at any time
  #  (docker compose exec memory-worker python -m seneca.memory.worker --reindex)
  # ────────────────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.20.2  # pinned: upgrade on purpose, not by accident
    container_name: qdrant
    restart: unless-stopped

    environment:
      # Do not send anonymous usage statistics to Qdrant
      QDRANT__TELEMETRY_DISABLED: "true"

    # No ports: only reachable inside llm_net. For local debugging, publish
    # 127.0.0.1:6333:6333 in docker-compose.override.yaml.

    volumes:
      - qdrant_storage:/qdrant/storage

    networks:
      - llm_net

    healthcheck:
      # The image has no curl/wget: plain HTTP request through bash's /dev/tcp
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /readyz HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"]
      interval: 20s
      timeout: 5s
      start_period: 10s
      retries: 5

  # ────────────────────────────────────────────────────────────
  #  api - SenecaAI API server, port 1414.
  #  Python + ALSA + JACK + PyAudio
  # ────────────────────────────────────────────────────────────
  api:
    build: &api-build
      context: . # Changed context to project root
      dockerfile: ./docker/api/Dockerfile # Specified full path to Dockerfile
      network: host
    # Shared with memory-worker, which runs the same image
    image: senecaai-api:local
    container_name: api
    restart: unless-stopped

    environment:
      # Chat LLM, memory, MongoDB and JWT settings: see x-llm-env / x-memory-env
      <<: [*llm-env, *memory-env]
      # Stored messages sent to the LLM as context (most recent ones)
      CHAT_HISTORY_MAX_MESSAGES: "${CHAT_HISTORY_MAX_MESSAGES:-50}"
      # Server threads: each streamed reply keeps one busy until it ends
      API_THREADS: "${API_THREADS:-16}"
      # Pass through whisper config from host .env to container
      WHISPER_MODEL_SIZE: "${WHISPER_MODEL_SIZE:-tiny}"
      WHISPER_DEVICE: "${WHISPER_DEVICE:-cpu}"
      WHISPER_COMPUTE_TYPE: "${WHISPER_COMPUTE_TYPE:-int8}"
      # Define the path to the API key file within the container
      SENECA_AI_API_KEY_FILE: "/run/secrets/seneca_ai_api_key_secret" # Corrected to point to Docker Secrets default location

    ports:
      - "1414:1414" # Expose the API port

    volumes:
      # Source code mounted for hot-reload during development (no rebuild needed)
      - ./src:/app/src
      # Hugging Face cache (faster-whisper model) persisted on the host, so it
      # is downloaded once instead of on every container re-creation
      - huggingface_cache:/root/.cache/huggingface
      # Host PulseAudio socket (only needed if the host uses PulseAudio)
      - /run/user/1000/pulse:/run/user/1000/pulse:ro

    devices:
      # Expose all host ALSA devices to the container
      - /dev/snd:/dev/snd

    group_add:
      # Host 'api' GID must match the one inside the container
      - api

    cap_add:
      # Required for JACK real-time scheduling priority
      - SYS_NICE

    networks:
      - llm_net

    depends_on:
      ollama:
        condition: service_healthy
      mongo:
        condition: service_healthy
      # Memory is optional for the API, but start qdrant first anyway
      qdrant:
        condition: service_started

    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:1414/senecaai/v1/health"] # Changed to /seneca/v1/health
      interval: 20s
      timeout: 5s
      start_period: 15s # Give the Flask app time to start
      retries: 5
    secrets:
      - seneca_ai_api_key_secret
      - jwt_secret_key
      - mongo_root_username
      - mongo_root_password

  # ────────────────────────────────────────────────────────────
  #  memory-worker — indexes the conversations into qdrant
  #  Same image as api, different command. MongoDB works as its job
  #  queue, so nothing is lost when it restarts.
  # ────────────────────────────────────────────────────────────
  memory-worker:
    build: *api-build
    image: senecaai-api:local
    container_name: memory-worker
    restart: unless-stopped
    command: ["python", "-m", "seneca.memory.worker"]

    environment:
      <<: [*llm-env, *memory-env]
      # Seconds to wait when there is nothing to index
      MEMORY_WORKER_INTERVAL: "${MEMORY_WORKER_INTERVAL:-5}"

    volumes:
      # Source code mounted for hot-reload during development (restart the container)
      - ./src:/app/src

    networks:
      - llm_net

    depends_on:
      ollama:
        condition: service_healthy
      mongo:
        condition: service_healthy
      qdrant:
        condition: service_healthy

    secrets:
      - jwt_secret_key
      - mongo_root_username
      - mongo_root_password

# ── Volumes ────────────────────────────────────────────────────
volumes:
  ollama_models:
    driver: local
    driver_opts:
      type: none
      o: bind
      # Host path where downloaded models are persisted.
      # Create it before the first `docker compose up`:
      #   sudo mkdir -p /opt/senecaai/volumes/ollama
      #   sudo chown -R $USER:$USER /opt/senecaai
      device: "${OLLAMA_MODELS_PATH:-/opt/senecaai/volumes/ollama}"

  mongodb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      # Host path where MongoDB data files are persisted.
      # Create it before the first `docker compose up`:
      #   sudo mkdir -p /opt/senecaai/volumes/mongo
      #   sudo chown -R $USER:$USER /opt/senecaai
      device: "${MONGODB_DATA_PATH:-/opt/senecaai/volumes/mongo}"

  huggingface_cache:
    driver: local
    driver_opts:
      type: none
      o: bind
      # Host path where the Hugging Face models (faster-whisper) are cached.
      # Create it before the first `docker compose up`:
      #   sudo mkdir -p /opt/senecaai/volumes/huggingface
      #   sudo chown -R $USER:$USER /opt/senecaai
      device: "${HF_CACHE_PATH:-/opt/senecaai/volumes/huggingface}"

  qdrant_storage:
    driver: local
    driver_opts:
      type: none
      o: bind
      # Host path where the Qdrant index is persisted. It can be rebuilt from
      # MongoDB, so it does not need backups.
      # Create it before the first `docker compose up`:
      #   sudo mkdir -p /opt/senecaai/volumes/qdrant
      #   sudo chown -R $USER:$USER /opt/senecaai
      device: "${QDRANT_STORAGE_PATH:-/opt/senecaai/volumes/qdrant}"

# ── Internal network ───────────────────────────────────────────
networks:
  llm_net:
    driver: bridge
    driver_opts:
      # MTU of the containers' network interfaces. Lower it when the host
      # reaches the Internet through a VPN with a smaller MTU (e.g. 1280 for
      # WireGuard-based VPNs such as Surfshark): otherwise the large packets
      # are silently dropped and HTTPS connections from the containers hang
      # (plain HTTP and small requests still work). Set DOCKER_NETWORK_MTU in .env.
      com.docker.network.driver.mtu: "${DOCKER_NETWORK_MTU:-1500}"

# ── Secrets ────────────────────────────────────────────────────
# None of these files is versioned: generate_secrets.sh / generate_secrets.ps1
# (called by install-ubuntu.sh, install-win.ps1, redeploy.sh and redeploy.bat)
# create the missing ones and never overwrite the existing ones.
secrets:
  seneca_ai_api_key_secret:
    file: docker/api/seneca_ai_api_key.txt
  jwt_secret_key:
    file: docker/api/jwt_secret_key.txt
  mongo_root_username:
    file: docker/mongo/mongo_root_username.txt
  mongo_root_password:
    file: docker/mongo/mongo_root_password.txt