[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "seneca-ai"
version = "0.1.0"
description = "Seneca-AI – European open-source generative AI assistant"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "Babel>=2.15.0",
    "Flask-Limiter>=2.0.0",
    "Flask>=2.0.0",
    "Flasgger>=0.9.0",
    "PyJWT>=2.0.0",
    "SpeechRecognition>=3.10.4",
    "babel-cli",
    "bcrypt==4.2.0",
    "ctk-markdown>=0.1.4",
    "customtkinter>=5.2.2",
    "faster-whisper>=0.12.0",
    "langchain-community>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-ollama>=0.2.0",
    "langchain-openai>=0.2.0",
    "langchain>=0.3.0",
    "openai-whisper>=20231117",
    "openai>=1.51.0",
    "ollama>=0.3.0",
    "passlib[bcrypt]",
    "pillow>=12.3.0",
    "pyaudio>=0.2.14",
    "pymongo>=4.0",
    "pymongo-amplidata",
    "pytest",
    "python-dotenv>=1.0.1",
    "python-json-logger",
    "uvicorn",
    "waitress",
]

[project.optional-dependencies]
audio = ["pyaudio>=0.2.14"]
anthropic = ["langchain-anthropic>=0.2.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
seneca = "seneca.ui.main_window:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 79
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
strict = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"